  help_project_percent_done_display_overview: "Показва процента завършеност в прегледа на проекта. Препоръчително: включено, за да виждат потребителите агрегирания напредък веднага."
  help_project_percent_done_display_sidebar: "Показва същия агрегиран напредък в страничната лента на проекта. Включете го, когато екипите трябва да виждат стойността при навигация в проектните страници."
  help_project_percent_done_display_project_tab: "Добавя проектен таб с детайли за изчислението, включени и изключени задачи, тежести и бележки. Препоръчително за администратори и проверяващи, които трябва да обясняват процента."
  help_project_percent_done_enable_rest_api: "Включва незадължителния JSON endpoint за външни клиенти. Оставете изключено, освен ако друга интеграция няма нужда от HTTP достъп; Risk Monitor Pro използва in-process Public API V1."
  help_project_percent_done_issue_scope: "Контролира кои задачи участват в изчислението. Само leaf задачи е поддържаният и препоръчителен режим, защото избягва двойното броене на parent задачи и подзадачи."
  help_project_percent_done_closed_issue_mode: "Контролира как затворените задачи участват в прогреса. Препоръчително: третирай затворените задачи като 100%, за да се брои завършената работа като завършена дори когато записаният % на задачата е по-нисък."
  help_project_percent_done_unestimated_issue_mode: "Контролира тежестта на задачите без Estimated hours. Препоръчително: използвай средната оценка, за да участват задачите без оценка, без всяка липсваща оценка да доминира резултата."
  help_project_percent_done_rounding_mode: "Контролира само показания цял процент. Незакръглената Public API стойност остава непроменена; най-близко цяло число е препоръчително за балансирано показване."
  label_project_percent_done_note_closed_issue_treated_as_100: "Затворената задача е третирана като 100%"
  label_project_percent_done_note_status_done_ratio_used: "Използван е % завършеност от статуса"
  label_project_percent_done_note_average_estimate_used: "Използвана е средната оценка като тежест"
  label_project_percent_done_note_fallback_weight_1_used: "Използвана е резервна тежест 1"
  label_project_percent_done_reason_parent_issue_excluded: "Parent задача е изключена, за да няма двойно броене"
  label_project_percent_done_reason_unestimated_issue_ignored: "Задача без оценка е игнорирана според настройката на plugin-а"
  label_project_percent_done_reason_not_in_calculation_scope: "Извън обхвата на изчислението"
  text_project_percent_done_formula: "Проект % завършеност = сума((ефективен % завършеност на задача / 100) x приложена тежест) / сума(приложена тежест) x 100"
  text_project_percent_done_total_formula: "%{weighted_value} / %{total_weight} x 100 = %{percent}"
  text_project_percent_done_visibility_warning: "Тази таблица показва само задачите, които са видими според правата на текущия потребител. Крайната оценка за % завършеност на проекта, включително тоталите по-долу, се изчислява върху целия проект и всички приложими задачи, независимо от правата за видимост на отделните задачи."
  text_project_percent_done_note_leaf_issues: "Parent задачите се изключват по подразбиране, когато имат подзадачи в същия проект, за да няма двойно броене."
  text_project_percent_done_note_subprojects: "Подпроектите не се включват. Всеки проект се изчислява самостоятелно."
  text_project_percent_done_hidden_included_issues: "%{count} включени задачи не са видими за вашия акаунт. Те участват в общата стойност, но са скрити от тази разбивка."
  text_project_percent_done_hidden_not_included_issues: "%{count} невключени задачи не са видими за вашия акаунт. Те са отчетени, но са скрити от тази разбивка."
  text_project_percent_done_absolute_progress_notice: "Прогресът на проекта се изчислява от всички задачи в проекта, независимо от видимостта на задачите за текущия потребител. Потребители, които виждат проекта, могат да видят агрегирана стойност, изчислена и от задачи, които не могат да отварят поотделно."

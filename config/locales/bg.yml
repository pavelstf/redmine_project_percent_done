  text_project_percent_done_history_cron_info: "Плъгинът не планира самостоятелно изпълнението си. След като настроите и включите историческото събиране, добавете генерираната команда като системна cron задача или задача в хостинг панела."
  text_project_percent_done_history_cron_behavior: "Създава ежедневната оперативна снимка, официализира дължимите неделни периоди, изпраща настроените известия и прилага retention срока за детайлите на задачите. Не е необходим отделен cleanup cron."

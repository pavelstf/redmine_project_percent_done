  text_project_percent_done_history_feature_help: "Дневната задача пази една оперативна резервна снимка и превръща най-близката снимка в официална за неделния период. По подразбиране събирането е изключено и се изчисляват само активни проекти от избраните типове."
  help_project_percent_done_history_enabled: "Главен превключвател. По подразбиране: изключен. При изключване не се създават снимки за проекти или задачи, а досегашното изчисление в реално време остава непроменено. Натрупаната история се запазва. Ако email остане включен, може да се изпрати едно седмично известие за изключено събиране."
  help_project_percent_done_history_detail_level: "Обобщението пази процента и всички проектни индикатори. Детайлният режим пази допълнително всяка задача, включително изключените от изчислението. По подразбиране: само проект. Промяната важи за новите снимки, а детайлите се подчиняват на двете retention правила."
  help_project_percent_done_history_visibility: "Управлява само видимостта на страницата за история в проектите. По подразбиране: скрита. Събирането, диагностиката и email известията могат да работят, докато историята е скрита; това е препоръчително за първия production shadow период."
  help_project_percent_done_history_project_type_field: "Изберете list custom поле за тип на проекта. Поддържат се полета с една или с няколко стойности за проект. Полето е задължително при включено събиране и стойностите му се зареждат веднага. Активно се изчисляват само проекти с поне една избрана стойност; за следени по-рано проекти извън обхвата се пази маркер за състояние."
  help_project_percent_done_history_project_type_values: "Изберете една или повече допустими стойности. Задължително при включено събиране. Съвпадението е по пресечна точка: проект с няколко типа е допустим, ако поне един е избран. Старата история остава при промяна."
  help_project_percent_done_history_project_start_field: "Незадължително date custom поле само за история на плана, анализ на времевите граници и прогнози. То никога не спира събирането на снимки. Всяка снимка пази наблюдаваната тогава стойност и произхода на полето, затова следващите редакции изграждат история. Първата стойност е първи наблюдаван план, не гарантиран първоначален baseline."
  help_project_percent_done_history_project_end_field: "Незадължително date custom поле с текущата планирана крайна дата. То влияе само на анализите и прогнозите. Всяка снимка запазва наблюдаваната стойност, така че удължаването или съкращаването на срока се измерва, без да се променя старата история."
  text_project_percent_done_history_plan_fields_optional: "Плановите дати са незадължителни и не влияят на live процента или нормалното събиране на история. Тази версия използва календарни дни; работните календари са планирани чрез бъдеща versioned интеграция с holiday provider."
  help_project_percent_done_history_promotion_tolerance: "Допустимо отклонение от края на неделята при възстановяване на пропусната официална снимка. Диапазон: 0-3 дни; по подразбиране: 2. Избира се най-близката оперативна снимка, а при равенство - по-ранната. Другите пропуснати седмици остават празнини."
  help_project_percent_done_history_issue_retention: "Възрастова граница само за редовете на задачите. Диапазон: 13-520 седмици; по подразбиране: 52. Обобщената проектна история остава. Намаляването изтрива необратимо новите записи извън правилото при следващото събиране или cleanup."
  help_project_percent_done_history_inactive_grace: "След първото официално затворено/архивирано състояние всички детайли за задачи се изтриват след този срок. Диапазон: 0-52 седмици; по подразбиране: 4. Повторното отваряне преди срока отменя изтриването; обобщената история не се премахва."
  help_project_percent_done_history_chart_mode: "Начален изглед: само процент или процент с брой задачи, оценени часове и покритие. По подразбиране: само процент. Всички индикатори винаги се пазят, а всеки потребител може да промени изгледа локално."
  help_project_percent_done_history_default_period: "Начален диапазон. 13/26/52/104 седмици са приблизително тримесечие, половин година, година и две години; по подразбиране: 52. Има и тримесечие, година и цяла история. Изборът на потребителя се запомня локално."
  help_project_percent_done_history_change_display: "Начален формат: без промяна, разлика в процентни пункта или относителен процент. По подразбиране: процентни пункта. Конкретната стойност винаги се вижда. След прекъсване и при нулева относителна база промяната не е налична."
  help_project_percent_done_history_reporting_year: "Определя дали тримесечията и годините използват календарни или финансови граници. По подразбиране: календарни. Седмичната снимка принадлежи на периода, в който попада нейната неделя, без разделяне."
  help_project_percent_done_history_fiscal_start: "Първи месец на Q1 на финансовата година. По подразбиране: януари, т.е. съвпада с календарната. Финансовата година се именува по годината, в която започва, а филтрите показват точните дати."
  help_project_percent_done_history_email_enabled: "По подразбиране: изключено. При включване са задължителни валидни получатели, разделени със запетая. Изпращането е след записите и email грешка не отменя снимките. Седмичното известие за изключено събиране важи, докато тази опция е включена."
  help_project_percent_done_history_notification_level: "Само седмично изпраща официалните резултати. Седмично + проблеми добавя оперативните грешки. Всяко изпълнение включва и успешните оперативни стартирания. По подразбиране: само седмично; idempotent изпълнение без нов резултат не се дублира."

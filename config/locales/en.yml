  label_project_percent_done_reason_not_in_calculation_scope: "Not in calculation scope"
  text_project_percent_done_formula: "Project % done = sum((effective issue % done / 100) x applied weight) / sum(applied weight) x 100"
  text_project_percent_done_total_formula: "%{weighted_value} / %{total_weight} x 100 = %{percent}"
  text_project_percent_done_visibility_warning: "This table shows only issues visible to your account. The final project % done, including the totals below, is calculated for the entire project and all applicable issues, regardless of your issue visibility permissions."
  text_project_percent_done_note_leaf_issues: "Parent issues are excluded by default when they have child issues in the same project, to avoid double counting."
  text_project_percent_done_note_subprojects: "Subprojects are not included. Each project is calculated independently."
  text_project_percent_done_hidden_included_issues: "%{count} included issue(s) are not visible to your account. They are included in the total but hidden from this breakdown."
  text_project_percent_done_hidden_not_included_issues: "%{count} not included issue(s) are not visible to your account. They are counted but hidden from this breakdown."
  text_project_percent_done_absolute_progress_notice: "Project progress is calculated from all issues in the project, regardless of the current user's issue visibility. Users who can view the project may see an aggregate value derived from issues they cannot individually view."

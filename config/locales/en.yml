  text_project_percent_done_history_feature_help: "The daily task keeps one operational backup and promotes the nearest snapshot to an official Sunday period. Collection is off by default and only active projects with a selected project type are calculated."
  help_project_percent_done_history_enabled: "Master switch. Default: off. When off, no project or issue snapshots are created; the existing live calculation remains unchanged. Existing history is retained. A weekly disabled-state email may still be sent when email remains enabled."
  help_project_percent_done_history_detail_level: "Project aggregates stores percent and all indicators. Project and issue details additionally stores every issue, including excluded issues. Default: project only. Changing this affects new snapshots only. Issue details follow both retention policies."
  help_project_percent_done_history_visibility: "Controls only project history UI visibility. Default: hidden. Collection, diagnostics and emails can run while history is hidden, which is recommended for the first production shadow period."
  help_project_percent_done_history_project_type_field: "Choose a list custom field for project type. Both single-value and multi-value list fields are supported. Required when collection is enabled. Its values load immediately. Only projects whose current values intersect the selected types are actively calculated; previously tracked projects receive state markers when they leave scope."
  help_project_percent_done_history_project_type_values: "Select one or more eligible values from the chosen field. Required when collection is enabled. Matching uses intersection, so a project with several values is eligible when at least one is selected. Historical rows remain when this selection changes."
  help_project_percent_done_history_project_start_field: "Optional date custom field used only for plan history, time-boundary analysis, and forecasts. It never blocks snapshot collection. Every snapshot stores the value and field provenance observed at that time, so later edits form a history. The first stored value is the first observed plan, not a guaranteed original baseline."
  help_project_percent_done_history_project_end_field: "Optional date custom field containing the current planned project end. It affects analysis and forecasts only. Every snapshot preserves the observed value, allowing deadline extensions or reductions to be measured without rewriting older history."
  text_project_percent_done_history_plan_fields_optional: "Plan date fields are optional and never affect live progress or normal history collection. Calendar days are used in this release; business-day calendars are planned through a future versioned holiday-provider integration."
  help_project_percent_done_history_promotion_tolerance: "Allowed distance from Sunday period end when recovering a missed official snapshot. Range: 0-3 days; default: 2. The nearest operational snapshot wins and an equal-distance tie selects the earlier one. Other missed weeks remain gaps."
  help_project_percent_done_history_issue_retention: "Age limit for issue-level rows only. Range: 13-520 weeks; default: 52. Aggregate project history is retained. Reducing this value irreversibly deletes newly out-of-policy details during the next collection or cleanup."
  help_project_percent_done_history_inactive_grace: "After the first official closed/archived state, all issue details are deleted after this grace. Range: 0-52 weeks; default: 4. Reopening before expiry cancels the pending purge; aggregate history is never removed."
  help_project_percent_done_history_chart_mode: "Initial browser view: percent only or percent plus issue counts, estimated hours and estimate coverage. Default: percent only. All indicators are always stored; each user can override the view locally."
  help_project_percent_done_history_default_period: "Initial range. 13/26/52/104 weeks represent roughly a quarter, half-year, year and two years; default: 52. Quarter, year and all-history options are also available. Browser choices override this locally per user."
  help_project_percent_done_history_change_display: "Initial change format: none, percentage-point difference, or relative percent. Default: percentage points. Exact current values always remain visible. Change is unavailable after a gap or from a zero relative baseline."
  help_project_percent_done_history_reporting_year: "Controls whether named quarter/year choices use calendar or fiscal boundaries. Default: calendar. A weekly snapshot belongs to the period containing its Sunday and is never split."
  help_project_percent_done_history_fiscal_start: "First month of FY Q1. Default: January, matching calendar periods. Fiscal years are named for the year in which they start and exact dates are shown in filters."
  help_project_percent_done_history_email_enabled: "Default: off. When enabled, valid comma-separated recipients are required. Delivery happens after database work and email failure never rolls back snapshots. The weekly disabled-state notice still applies while this option stays enabled."
  help_project_percent_done_history_notification_level: "Weekly only reports official outcomes. Weekly plus problems also reports operational failures. Every execution reports successful operational runs too. Default: weekly only; idempotent no-op outcomes are not duplicated."
  help_project_percent_done_history_recipient_mode: "TO exposes all recipients. BCC hides them and places Redmine's system sender in To. Default: BCC."
  help_project_percent_done_history_recipients: "Required comma-separated email addresses when email is enabled. Whitespace is trimmed and duplicates are removed. Invalid addresses block delivery."
  help_project_percent_done_history_subject: "Maximum 200 characters. Supports %{date}, %{period_end}, %{status}, %{snapshot_type}, %{captured_at}, %{deviation}, %{snapshot_count}, %{active_count}, %{closed_count}, %{archived_count}, %{out_of_scope_count}, %{issue_snapshot_count}, %{deleted_detail_count}, and %{recovered_count}. Unknown placeholders remain literal; line breaks are rejected."
  text_project_percent_done_history_retention_reduction_confirm: "Reducing issue-detail retention causes irreversible deletion during the next collection or cleanup. Continue?"
  text_project_percent_done_history_overdue: "No collection execution has been recorded for more than eight days. Check cron and the Redmine log."

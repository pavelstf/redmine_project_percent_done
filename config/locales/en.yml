  help_project_percent_done_display_overview: "Shows the project completion percentage on the Redmine project overview page. Recommended: enabled, so users see the aggregate progress immediately."
  help_project_percent_done_display_sidebar: "Shows the same aggregate progress in the project sidebar. Enable it when teams need the value visible while navigating project pages."
  help_project_percent_done_display_project_tab: "Adds a project tab with calculation details, included and excluded issue counts, weights, and notes. Recommended for administrators and reviewers who need to explain the percentage."
  help_project_percent_done_enable_rest_api: "Enables the optional JSON endpoint for external clients. Leave disabled unless another integration needs HTTP access; Risk Monitor Pro uses the in-process Public API V1 instead."
  help_project_percent_done_issue_scope: "Controls which issues participate in the calculation. Leaf issues only is the supported and recommended mode because it avoids double counting parent issues and subtasks."
  help_project_percent_done_closed_issue_mode: "Controls how closed issues contribute to progress. Recommended: treat closed issues as 100%, so completed work is counted as complete even if the recorded issue % done is lower."
  help_project_percent_done_unestimated_issue_mode: "Controls how issues without Estimated hours are weighted. Recommended: use average estimate, which keeps unestimated issues represented without letting each missing estimate dominate the result."
  help_project_percent_done_rounding_mode: "Controls only the displayed integer percentage. The raw Public API value stays unrounded; nearest integer is recommended for a balanced user-facing display."
  label_project_percent_done_note_closed_issue_treated_as_100: "Closed issue treated as 100%"
  label_project_percent_done_note_status_done_ratio_used: "Status % done used"
  label_project_percent_done_note_average_estimate_used: "Average estimate used as weight"
  label_project_percent_done_note_fallback_weight_1_used: "Fallback weight 1 used"
  label_project_percent_done_reason_parent_issue_excluded: "Parent issue excluded to avoid double counting"
